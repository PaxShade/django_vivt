{% load static %}
<!DOCTYPE html>
<html lang="ru" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Мой сайт" }} | ACME</title>

    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    
    <!-- 1. Локальный Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    
    <!-- 2. Локальные Bootstrap Icons -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}">
    
    <!-- 3. Ваш кастомный CSS (где прописан шрифт Roboto) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column h-100 bg-light">

    <!-- Навигационная панель Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <!-- Логотип/Бренд -->
            <a class="navbar-brand fw-bold text-uppercase tracking-wider" href="{% url 'pages:index' %}">
                <i class="bi bi-cpu-fill me-2 text-primary"></i>ACME Project
            </a>
            
            <!-- Кнопка "гамбургер" для мобильных устройств -->
            <button class="navbar-brand navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключатель навигации">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Ссылки навигации -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'pages:index' %}">
                            <i class="bi bi-house-door me-1"></i>Главная
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalog:catalog_list' %}">
                            <i class="bi bi-grid me-1"></i>Каталог
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'pages:about' %}">
                            <i class="bi bi-info-circle me-1"></i>О компании
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'pages:rules' %}">
                            <i class="bi bi-shield-check me-1"></i>Правила
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент сайта с отступами -->
    <main class="flex-shrink-0 my-5">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Подвал сайта (Footer) -->
    <footer class="footer mt-auto py-3 bg-white border-top text-center text-muted">
        <div class="container">
            <span>&copy; {% now "Y" %} ACME Project. Все права защищены. Локальная сборка.</span>
        </div>
    </footer>

    <!-- 4. Локальный Bootstrap JS -->
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
